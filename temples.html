<!DOCTYPE html>

            <figure>
                <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=600" alt="Temple surrounded by nature">

            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=600" alt="Traditional temple building">

            <figure>

            <figure>

                <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=600" alt="Magnificent temple building">
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Temple Album |
